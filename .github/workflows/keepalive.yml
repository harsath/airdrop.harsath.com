# Free Supabase projects pause after about a week with little activity.
# One tiny database call a day keeps it awake.
name: keep supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping database
        run: |
          curl -fsS -X POST "https://vakzpjtoqvzxmilqnbwr.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_gQ7JlF6hbkTQjoRsAIL8rQ_32rs1xdC" \
            -H "Content-Type: application/json" -d '{}'
