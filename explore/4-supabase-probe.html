<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supabase probe</title>
<style>
  :root { --bg:#fff; --fg:#111; --dim:#777; --ok:#0a7d32; --bad:#c0262d; --warn:#a15c00; --box:#f4f4f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --dim:#888; --ok:#4cd07d; --bad:#ff6b6b; --warn:#ffb347; --box:#1c1c1c; } }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace, Menlo, Consolas, monospace; margin:0; padding:16px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p { color:var(--dim); margin:0 0 12px; }
  button { font:inherit; padding:6px 14px; cursor:pointer; }
  #log { background:var(--box); padding:12px; margin-top:12px; white-space:pre-wrap; word-break:break-all; min-height:200px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .dim { color:var(--dim); }
</style>
</head>
<body>
<h1>Supabase reachability probe</h1>
<p>Run this on the corporate VM. Every line should end in OK. Then click Copy and paste the result back.</p>
<button id="run">Run probe</button> <button id="copy">Copy result</button>
<div id="log"></div>

<script type="module">
const SUPABASE_URL = 'https://vakzpjtoqvzxmilqnbwr.supabase.co'
const STORAGE_URL  = 'https://vakzpjtoqvzxmilqnbwr.storage.supabase.co' // direct host used for resumable uploads
const KEY = 'sb_publishable_gQ7JlF6hbkTQjoRsAIL8rQ_32rs1xdC'
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm'

const logEl = document.getElementById('log')
const line = (text, cls = '') => { const d = document.createElement('div'); d.className = cls; d.textContent = text; logEl.append(d) }
const result = (name, ok, detail = '') => line(`${ok ? 'OK  ' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`, ok ? 'ok' : 'bad')
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(`timeout ${ms}ms`)), ms))])

async function httpCheck(name, url, headers = { apikey: KEY }) {
  try {
    const res = await withTimeout(fetch(url, { headers }), 10000)
    // Any HTTP status means the host is reachable; only a network error / timeout means blocked.
    result(name, true, `HTTP ${res.status}`)
    return true
  } catch (e) { result(name, false, e.message); return false }
}

async function rawWebSocket() {
  const url = `${SUPABASE_URL.replace('https', 'wss')}/realtime/v1/websocket?apikey=${KEY}&vsn=1.0.0`
  return new Promise(resolve => {
    const ws = new WebSocket(url)
    const t = setTimeout(() => { result('realtime websocket (raw)', false, 'no open after 10s'); try { ws.close() } catch {} ; resolve(false) }, 10000)
    ws.onopen = () => { clearTimeout(t); result('realtime websocket (raw)', true, 'upgrade accepted'); ws.close(); resolve(true) }
    ws.onerror = () => { clearTimeout(t); result('realtime websocket (raw)', false, 'error event'); resolve(false) }
  })
}

async function run() {
  logEl.textContent = ''
  line(`time: ${new Date().toISOString()}`, 'dim')
  line(`origin: ${location.origin}`, 'dim')
  line(`ua: ${navigator.userAgent}`, 'dim')
  line('')

  // 1. CDN
  let createClient
  try { ({ createClient } = await withTimeout(import(SUPABASE_JS), 15000)); result('load supabase-js from jsdelivr', true) }
  catch (e) { result('load supabase-js from jsdelivr', false, e.message) }

  // 2. Plain HTTPS to each host the app will use
  await httpCheck('auth API      (https, main host)', `${SUPABASE_URL}/auth/v1/health`)
  await httpCheck('storage API   (https, main host)', `${SUPABASE_URL}/storage/v1/bucket`)
  await httpCheck('storage API   (https, direct storage host)', `${STORAGE_URL}/storage/v1/bucket`)

  // 3. Websocket upgrade through any proxy
  await rawWebSocket()

  if (!createClient) { line('\nskipping client tests: supabase-js did not load', 'warn'); return }
  const sb = createClient(SUPABASE_URL, KEY, { auth: { persistSession: false } })

  // 4. Anonymous sign-in (needs the dashboard toggle)
  try {
    const { data, error } = await withTimeout(sb.auth.signInAnonymously(), 10000)
    if (error) result('anonymous sign-in', false, error.message)
    else result('anonymous sign-in', true, `uid ${data.user.id.slice(0, 8)}…`)
  } catch (e) { result('anonymous sign-in', false, e.message) }

  // 5. Realtime: subscribe to a channel, broadcast to self, receive it back
  const topic = `probe-${crypto.randomUUID().slice(0, 8)}`
  const ch = sb.channel(topic, { config: { broadcast: { self: true, ack: true } } })
  const echoed = new Promise(res => ch.on('broadcast', { event: 'ping' }, p => res(p.payload)))
  try {
    const status = await withTimeout(new Promise(res => ch.subscribe(s => { if (s !== 'CLOSED') res(s) })), 15000)
    result('realtime channel subscribe', status === 'SUBSCRIBED', status)
    if (status === 'SUBSCRIBED') {
      const sent = Date.now()
      await ch.send({ type: 'broadcast', event: 'ping', payload: { sent } })
      const p = await withTimeout(echoed, 10000)
      result('realtime broadcast round-trip', true, `${Date.now() - p.sent} ms`)

      // 6. Some proxies drop websockets that live longer than a heartbeat or two
      line('holding the socket open 60s (proxy idle-kill check)…', 'dim')
      await new Promise(r => setTimeout(r, 60000))
      const echoed2 = new Promise(res => ch.on('broadcast', { event: 'ping2' }, () => res(true)))
      await ch.send({ type: 'broadcast', event: 'ping2', payload: {} })
      try { await withTimeout(echoed2, 10000); result('realtime still alive after 60s', true) }
      catch (e) { result('realtime still alive after 60s', false, e.message) }
    }
  } catch (e) { result('realtime', false, e.message) }
  finally { sb.removeChannel(ch) }

  line('\ndone.', 'dim')
}

document.getElementById('run').onclick = run
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(logEl.innerText).catch(() => {})
</script>
</body>
</html>
